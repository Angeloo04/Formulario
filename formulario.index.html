<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Completo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1ede7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-principal {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            padding: 35px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #b54708;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitulo {
            text-align: center;
            color: #716965;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tarjeta {
            background-color: #ffffff;
            border: 1.5px solid #ebdcd0;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px rgba(181, 71, 8, 0.04);
        }

        .titulo-seccion {
            color: #7a2705;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        label {
            font-size: 13.5px;
            font-weight: 600;
            color: #4a4543;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="url"],
        input[type="search"],
        input[type="date"],
        input[type="time"],
        input[type="month"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2d7ce;
            border-radius: 8px;
            background-color: #faf8f5;
            font-size: 14px;
            color: #2e2b2a;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="color"] {
            border: 1.5px solid #e2d7ce;
            border-radius: 8px;
            height: 42px;
            width: 100%;
            background-color: #faf8f5;
            cursor: pointer;
            padding: 4px;
        }

        input[type="file"] {
            font-size: 13px;
            color: #4a4543;
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b54708;
            background-color: #ffffff;
        }

        .radio-grupo {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .opcion-radio, .opcion-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #3b3634;
            cursor: pointer;
        }

        input[type="radio"], input[type="checkbox"] {
            accent-color: #b54708;
            cursor: pointer;
        }

        .botones {
            display: flex;
            gap: 14px;
            margin-top: 15px;
        }

        .btn-enviar {
            flex: 1;
            padding: 13px;
            background-color: #b54708;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-enviar:hover {
            background-color: #93370d;
        }

        .btn-limpiar {
            flex: 1;
            padding: 13px;
            background-color: #3e444e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-limpiar:hover {
            background-color: #2b3038;
        }
    </style>
</head>
<body>

    <main class="contenedor-principal">
        <h1>Formulario de Registro</h1>
        <p class="subtitulo">Ingresa los datos requeridos para completar tu ficha personal</p>

        <form action="proceso.php" method="post" enctype="multipart/form-data">

            <!-- Bloque 1: Datos de Contacto y Cuenta -->
            <section class="tarjeta">
                <h2 class="titulo-seccion">Datos de Contacto y Cuenta</h2>
                <div class="grid-3">
                    <div class="campo">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="987 654 321">
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="campo">
                        <label for="web">Sitio Web / Portafolio:</label>
                        <input type="url" id="web" name="web" placeholder="https://misitio.com">
                    </div>

                    <div class="campo">
                        <label for="buscar">Búsqueda rápida:</label>
                        <input type="search" id="buscar" name="buscar" placeholder="Palabras clave...">
                    </div>
                </div>
            </section>

            <!-- Bloque 2: Datos Personales y Demográficos -->
            <section class="tarjeta">
                <h2 class="titulo-seccion">Información Personal</h2>
                <div class="grid-3">
                    <div class="campo">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" min="1" max="120" placeholder="18">
                    </div>

                    <div class="campo">
                        <label for="nacionalidad">País de Residencia:</label>
                        <select id="nacionalidad" name="nacionalidad">
                            <option value="" disabled selected>Selecciona tu país...</option>
                            <option value="pe">Perú</option>
                            <option value="mx">México</option>
                            <option value="co">Colombia</option>
                            <option value="ar">Argentina</option>
                            <option value="cl">Chile</option>
                            <option value="es">España</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Género:</label>
                        <div class="radio-grupo">
                            <label class="opcion-radio">
                                <input type="radio" name="genero" value="m"> Masculino
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="genero" value="f"> Femenino
                            </label>
                            <label class="opcion-radio">
                                <input type="radio" name="genero" value="otro"> Otro
                            </label>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bloque 3: Fechas y Horarios -->
            <section class="tarjeta">
                <h2 class="titulo-seccion">Fechas y Programación</h2>
                <div class="grid-3">
                    <div class="campo">
                        <label for="nacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="nacimiento" name="nacimiento">
                    </div>

                    <div class="campo">
                        <label for="hora_contacto">Hora de contacto preferida:</label>
                        <input type="time" id="hora_contacto" name="hora_contacto">
                    </div>

                    <div class="campo">
                        <label for="mes_inicio">Mes de disponibilidad:</label>
                        <input type="month" id="mes_inicio" name="mes_inicio">
                    </div>
                </div>
            </section>

            <!-- Bloque 4: Archivos y Preferencias -->
            <section class="tarjeta">
                <h2 class="titulo-seccion">Adjuntos y Personalización</h2>
                <div class="grid-2">
                    <div class="campo">
                        <label for="curriculum">Subir CV o Documento (PDF):</label>
                        <input type="file" id="curriculum" name="curriculum" accept=".pdf,.doc,.docx">
                    </div>

                    <div class="campo">
                        <label for="color_tema">Color de perfil preferido:</label>
                        <input type="color" id="color_tema" name="color_tema" value="#b54708">
                    </div>
                </div>

                <div class="campo">
                    <label for="presentacion">Presentación breve:</label>
                    <textarea id="presentacion" name="presentacion" placeholder="Escribe aquí un resumen sobre ti o tus objetivos..."></textarea>
                </div>

                <label class="opcion-check" style="margin-top: 10px;">
                    <input type="checkbox" name="noticias" value="si" checked>
                    Recibir novedades y boletines por correo
                </label>

                <label class="opcion-check" style="margin-top: 6px;">
                    <input type="checkbox" name="terminos" value="si" required>
                    Acepto los términos, condiciones y políticas de privacidad
                </label>
            </section>

            <!-- Botones finales -->
            <div class="botones">
                <button type="submit" class="btn-enviar">ENVIAR FORMULARIO</button>
                <button type="reset" class="btn-limpiar">LIMPIAR CAMPOS</button>
            </div>

        </form>
    </main>

</body>
</html>
